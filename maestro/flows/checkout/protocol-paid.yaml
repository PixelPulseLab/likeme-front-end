appId: app.likeme.com
name: Checkout — protocolo pago (Pagarme sandbox + e-mail)
tags:
  - checkout
---
- runFlow: ../../shared/bootstrap-authenticated.yaml
- openLink: likeme://product/${E2E_CHECKOUT_PROTOCOL_PRODUCT_ID}
- scrollUntilVisible:
    element:
      id: "product-details-add-to-cart"
    direction: DOWN
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "e2e.product.tab.agreements"
    commands:
      - tapOn:
          id: "e2e.product.tab.agreements"
- scrollUntilVisible:
    element:
      id: "e2e.product.programTerms"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "e2e.product.programTerms"
- scrollUntilVisible:
    element:
      id: "product-details-add-to-cart"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "product-details-add-to-cart"
- runFlow: ../../shared/open-cart-and-start-checkout.yaml
- runFlow: ../../shared/fill-checkout-payment.yaml
- tapOn:
    id: "button-continue"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "e2e.checkout.orderSuccess"
    timeout: 120000
