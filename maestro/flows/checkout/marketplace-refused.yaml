appId: app.likeme.com
name: Checkout — marketplace recusado (CVV 651)
tags:
  - checkout
---
- runFlow: ../../shared/bootstrap-authenticated.yaml
- openLink: likeme://product/${E2E_CHECKOUT_PRODUCT_ID}
- scrollUntilVisible:
    element:
      id: "product-details-add-to-cart"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "product-details-add-to-cart"
- runFlow: ../../shared/start-checkout-from-cart.yaml
- runFlow:
    file: ../../shared/fill-checkout-payment.yaml
    env:
      E2E_CARD_CVV: "651"
- tapOn:
    id: "button-continue"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "e2e.checkout.paymentError"
    timeout: 120000
- assertVisible:
    id: "e2e.checkout.paymentForm"
- assertNotVisible:
    id: "order-completion"
