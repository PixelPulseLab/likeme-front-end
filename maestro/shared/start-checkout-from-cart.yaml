# Shared: do carrinho até o formulário de pagamento
# Adicionar ao carrinho já navega para Cart (useProductDetails.handleAddToCart)
appId: app.likeme.com
---
- extendedWaitUntil:
    visible:
      id: "e2e.cart.root"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "e2e.cart.billingPeriod.${E2E_CHECKOUT_BILLING_PERIOD}"
    commands:
      - tapOn:
          id: "e2e.cart.billingPeriod.${E2E_CHECKOUT_BILLING_PERIOD}"
- scrollUntilVisible:
    element:
      id: "e2e.cart.checkout"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "e2e.cart.checkout"
- scrollUntilVisible:
    element:
      id: "e2e\\.checkout\\.addressForm"
    direction: DOWN
    visibilityPercentage: 10
    timeout: 30000
- runFlow: fill-checkout-address.yaml
- tapOn:
    id: "button-continue"
