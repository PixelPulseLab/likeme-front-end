# PDP de protocolo → carrinho → endereço (até o pagamento)
appId: app.likeme.com
---
- openLink: likeme://product/${E2E_CHECKOUT_PROTOCOL_PRODUCT_ID}
- extendedWaitUntil:
    visible:
      id: "e2e.product.root"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "product-details-add-to-cart"
    direction: DOWN
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "e2e.product.tab.agreements"
    commands:
      - tapOn:
          id: "e2e.product.tab.agreements"
- scrollUntilVisible:
    element:
      id: "e2e.product.programTerms"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "e2e.product.programTerms"
- scrollUntilVisible:
    element:
      id: "product-details-add-to-cart"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "product-details-add-to-cart"
- extendedWaitUntil:
    visible:
      id: "e2e\\.cart\\.root"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "já adicionou este programa ao carrinho"
    commands:
      - tapOn: "OK"
      - tapOn:
          id: "e2e.nav.home"
      - extendedWaitUntil:
          visible:
            id: "e2e.summary.root"
          timeout: 30000
      - tapOn:
          id: "e2e.header.cart"
- runFlow: start-checkout-from-cart.yaml
