appId: app.likeme.com
---
# Exporta todas as telas do app como screenshots (PNG)
# Execute: npm run export:screenshots
# Screenshots são salvos em .maestro/screenshots/ (ou --test-output-dir)

- launchApp:
    clearState: true

# Aguardar tela de Loading
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# === TELAS DE AUTH (sem login) ===

# InvitationCode (first launch sem token)
- takeScreenshot: screens/01-InvitationCode

# Welcome
- waitForAnimationToEnd
- takeScreenshot: screens/02-Welcome
- tapOn:
    id: "input-Seu nome"
    optional: true
- tapOn:
    id: "input-Your name"
    optional: true
- inputText: "Usuario Teste"
- pressKey: Enter

# Intro (botão: "Sim, claro" em pt-BR ou "Yes, sure" em en)
- waitForAnimationToEnd
- takeScreenshot: screens/03-Intro
- tapOn:
    text: "Sim, claro"
    optional: true
- tapOn:
    text: "Yes, sure"
    optional: true

# Para capturar as telas do app autenticado, execute export-screenshots-app.yaml após login.
